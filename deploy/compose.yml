# Lives in /opt/invtracker on the server next to .env, litestream.yml and data/.
# The deploy workflow copies this file there and runs `docker compose up -d`.
services:
  # One-shot: on a fresh server, restores the database from the R2 backup (no-op otherwise).
  restore:
    image: litestream/litestream:0.3.13
    command: restore -if-db-not-exists -if-replica-exists /data/invtracker.db
    env_file: .env
    volumes:
      - ./data:/data
      - ./litestream.yml:/etc/litestream.yml:ro

  app:
    image: ghcr.io/saics/invtracker:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: file:/app/data/invtracker.db
    volumes:
      - ./data:/app/data
    depends_on:
      restore:
        condition: service_completed_successfully

  # Continuous backup of the SQLite database to Cloudflare R2.
  litestream:
    image: litestream/litestream:0.3.13
    restart: unless-stopped
    command: replicate
    env_file: .env
    volumes:
      - ./data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    depends_on:
      app:
        condition: service_healthy

  # Public access only through the Cloudflare Tunnel (no open ports); Cloudflare Access does the login.
  cloudflared:
    image: cloudflare/cloudflared:2024.12.2
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app
